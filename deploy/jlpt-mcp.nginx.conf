# VPS-side vhost: Cloudflare -> nginx (TLS + authenticated origin pulls)
#   -> WireGuard -> NUC running jlpt-mcp-server.
# Install as /etc/nginx/sites-enabled/jlpt-mcp.nginx.conf and adjust:
#   - server_name (needs a proxied DNS record in Cloudflare)
#   - proxy_pass upstream (NUC WireGuard address : server PORT)

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name jlpt.nyanshell.com;

    # The MCP secret is a URL path segment; keep it out of access logs.
    access_log off;

    location / {
        proxy_pass http://10.6.0.7:8080;

        # Keep-alive to the upstream; the Zig server speaks HTTP/1.1.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Responses are plain JSON today, but MCP's Streamable HTTP allows
        # SSE; unbuffered proxying keeps that working if it is ever enabled.
        proxy_buffering off;

        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # The server caps request bodies at 1 MiB; match it here.
        client_max_body_size 1m;

        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    ssl_certificate         /etc/ssl/nyanshell.com.cloudflare.cert.pem;
    ssl_certificate_key     /etc/ssl/nyanshell.com.cloudflare.privkey.pem;
    ssl_client_certificate /etc/ssl/authenticated_origin_pull_ca.pem;
    ssl_verify_client on;
}
